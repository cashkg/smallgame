<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數獨競技場 | Sudoku Arena</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body style="margin:0; background:#F8F9FA;">
    <div id="setup-page" class="screen active">
        <div class="rank-banner" style="background:#2C3E50; color:white; padding:15px; border-radius:12px; text-align:center;">
            <div id="player-rank-tag" style="font-size:12px; opacity:0.8;">新手玩家 🌱</div>
            <div id="display-total-score" style="font-size:28px; font-weight:bold; color:#F1C40F;">0</div>
        </div>

        <div style="text-align:center; background:white; border:2px solid #F1C40F; border-radius:50px; padding:10px; margin:15px 0;">
            <span id="score-preview" style="color:#D35400; font-weight:bold; font-size:18px;">預估加成: x1.0</span>
        </div>

        <div class="difficulty-group" style="display:flex; gap:8px; margin-bottom:15px;">
            <button class="diff-btn" onclick="selectDifficulty(35)">初級 35</button>
            <button class="diff-btn" onclick="selectDifficulty(42)">中級 42</button>
            <button class="diff-btn" onclick="selectDifficulty(49)">高級 49</button>
        </div>

        <div style="background:#FFF3E0; padding:15px; border-radius:12px; text-align:center;">
            <div style="font-weight:bold; color:#E67E22; margin-bottom:10px;">🔥 極限模式 (50-64格)</div>
            <div style="display:flex; justify-content:center; align-items:center; gap:20px;">
                <button onclick="adjustLimit(-1)" style="width:45px; height:45px; font-size:24px;">−</button>
                <span id="limit-display" style="font-size:32px; font-weight:bold; width:60px;">50</span>
                <button onclick="adjustLimit(1)" style="width:45px; height:45px; font-size:24px;">+</button>
            </div>
        </div>

        <div id="arena-code" style="font-size:10px; color:#999; text-align:center; margin-top:15px; font-family:monospace;">SEED: Generating...</div>
        <button class="main-btn primary" onclick="startGame()" style="width:100%; margin-top:20px; padding:18px; background:#4A90E2; color:white; border:none; border-radius:50px; font-size:20px; font-weight:bold;">進入競技場</button>
    </div>

    <div id="game-page" class="screen">
        <div style="display:flex; justify-content:space-between; align-items:center; background:#4A90E2; color:white; padding:10px; border-radius:8px;">
            <div>難度: <span id="current-diff-display">--</span> (<span id="current-coeff-display">x1.0</span>)</div>
            <div id="timer" style="font-weight:bold;">00:00</div>
            <button onclick="confirmExit()" style="background:#E74C3C; border:none; color:white; padding:5px 12px; border-radius:4px;">退出</button>
        </div>
        <div id="sudoku-board" class="sudoku-board"></div>
        <div class="controls">
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <button id="note-mode-btn" onclick="toggleNoteMode()" style="flex:1; padding:10px;">✏️ 筆記: 關</button>
                <button onclick="eraseCell()" style="flex:1;
