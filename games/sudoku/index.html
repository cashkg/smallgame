<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數獨競技場 | Sudoku Arena</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        /* 強制防塌陷樣式 */
        .screen { display: none; width: 100%; max-width: 480px; flex-direction: column; padding: 15px; box-sizing: border-box; margin: 0 auto; }
        .screen.active { display: flex !important; }
        .sudoku-board {
            display: grid; grid-template-columns: repeat(9, 1fr);
            aspect-ratio: 1 / 1; width: 100%; background: #333;
            border: 2px solid #333; margin: 20px 0;
        }
        .cell {
            background: #fff; border: 0.5px solid #eee; display: flex; 
            justify-content: center; align-items: center; font-size: 24px; 
            cursor: pointer; aspect-ratio: 1 / 1; user-select: none;
        }
        .cell.fixed { font-weight: bold; color: #000; background: #f0f0f0; }
        .cell.selected { background: #4A90E2 !important; color: white; }
    </style>
</head>
<body style="margin:0; background:#F8F9FA;">
    <div id="setup-page" class="screen active">
        <div style="background:#2C3E50; color:white; padding:20px; border-radius:12px; text-align:center;">
            <div id="player-rank-tag">新手玩家 🌱</div>
            <div id="display-total-score" style="font-size:28px; font-weight:bold; color:#F1C40F;">0</div>
        </div>
        <div style="margin-top:20px; display:flex; flex-direction:column; gap:10px;">
            <button class="main-btn primary" onclick="startGame()" style="background:#4A90E2; color:white; padding:18px; border-radius:50px; border:none; font-size:20px; font-weight:bold;">開始競技</button>
            <button onclick="location.href='../../index.html'" style="background:none; border:none; color:#777;">回大廳</button>
        </div>
    </div>

    <div id="game-page" class="screen">
        <div style="display:flex; justify-content:space-between; align-items:center; background:#4A90E2; color:white; padding:10px; border-radius:8px;">
            <div id="timer">00:00</div>
            <button onclick="confirmExit()" style="background:#E74C3C; border:none; color:white; border-radius:4px; padding:5px 10px;">退出</button>
        </div>
        <div id="sudoku-board" class="sudoku-board"></div>
        <div class="numpad" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px;">
            <button onclick="inputAction(1)" style="height:60px; font-size:24px;">1</button>
            </div>
    </div>

    <script src="./js/engine.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
