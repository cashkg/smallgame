<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數獨競技場 | Sudoku Arena</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        /* 防塌陷基礎樣式 */
        .screen { display: none; width: 100%; max-width: 480px; flex-direction: column; padding: 15px; box-sizing: border-box; }
        .screen.active { display: flex !important; }
        .sudoku-board {
            display: grid; grid-template-columns: repeat(9, 1fr);
            aspect-ratio: 1 / 1; width: 100%; background: #333;
            border: 2px solid #333; margin-bottom: 20px;
        }
        .cell {
            background: #fff; display: flex; justify-content: center;
            align-items: center; font-size: 24px; cursor: pointer; aspect-ratio: 1 / 1;
        }
        .rank-banner { background: #2C3E50; color: white; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 15px; }
        .current-stat-banner { background: #4A90E2; color: white; display: flex; justify-content: space-around; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-weight: bold; font-size: 14px; }
        .hidden { display: none !important; }
    </style>
</head>
<body style="margin:0; display:flex; justify-content:center; background:#F8F9FA;">

    <div id="setup-page" class="screen active">
        <div class="rank-banner">
            <div id="player-rank-tag">載入中...</div>
            <div id="display-total-score" style="font-size: 24px; font-weight: bold; color: #F1C40F;">0</div>
            <div style="font-size: 12px; opacity: 0.8;">目前累積競技積分</div>
        </div>

        <div class="difficulty-group" style="display: flex; gap: 8px; margin-bottom: 10px;">
            <button class="diff-btn" onclick="selectDifficulty(35)" style="flex:1; padding:12px; border-radius:10px; border:1px solid #ccc;">初級 35</button>
            <button class="diff-btn" onclick="selectDifficulty(42)" style="flex:1; padding:12px; border-radius:10px; border:1px solid #ccc;">中級 42</button>
            <button class="diff-btn" onclick="selectDifficulty(49)" style="flex:1; padding:12px; border-radius:10px; border:1px solid #ccc;">高級 49</button>
        </div>

        <div class="limit-mode-zone" style="background:#FFF3E0; padding:15px; border-radius:12px;">
            <div style="font-weight:bold; color:#E67E22; margin-bottom:10px;">🔥 極限模式 (50-64格)</div>
            <div style="display:flex; justify-content:center; align-items:center; gap:20px;">
                <button onclick="adjustLimit(-1)" style="width:40px; height:40px; font-size:24px;">−</button>
                <span id="limit-display" style="font-size:32px; font-weight:bold; width:60px; text-align:center;">50</span>
                <button onclick="adjustLimit(1)" style="width:40px; height:40px; font-size:24px;">+</button>
            </div>
            <div style="text-align:center; margin-top:10px; background:#fff; border-radius:50px; border:1px solid #F1C40F; padding:5px;">
                <span id="score-preview" style="color:#D35400; font-weight:bold;">加權: x8.0</span>
            </div>
        </div>

        <div id="arena-code" style="font-size:10px; color:#999; text-align:center; margin:15px 0; font-family:monospace;">Generating SEED...</div>

        <div style="display:flex; flex-direction:column; gap:10px;">
            <button class="main-btn primary" onclick="startGame()" style="background:#4A90E2; color:white; padding:18px; border-radius:50px; font-size:20px; font-weight:bold; border:none;">進入競技場</button>
            <button id="resume-btn" class="hidden" onclick="resumeGame()" style="padding:12px; border:none; border-radius:10px; background:#95A5A6; color:white;">繼續上一局</button>
            <button onclick="location.href='../../index.html'" style="background:none; border:none; color:#777; padding:10px;">回主大廳</button>
        </div>
    </div>

    <div id="game-page" class="screen">
        <div class="current-stat-banner">
            <div>難度: <span id="current-diff-display">--</span> (<span id="current-coeff-display">x1.0</span>)</div>
            <div>⏱ <span id="timer">00:00</span></div>
            <button onclick="confirmExit()" style="background:#E74C3C; color:white; border:none; border-radius:4px; padding:4px 10px;">退出</button>
        </div>
        
        <div id="sudoku-board" class="sudoku-board"></div>
        
        <div class="controls">
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <button id="note-mode-btn" onclick="toggleNoteMode()" style="flex:1; padding:12px; border-radius:8px; border:1px solid #ccc; background:white;">✏️ 筆記: 關</button>
                <button onclick="eraseCell()" style="flex:1; padding:12px; border-radius:8px; border:1px solid #ccc; background:white;">⌫ 擦除</button>
            </div>
            <div class="numpad">
                <button onclick="inputAction(1)">1</button><button onclick="inputAction(2)">2</button><button onclick="inputAction(3)">3</button>
                <button onclick="inputAction(4)">4</button><button onclick="inputAction(5)">5</button><button onclick="inputAction(6)">6</button>
                <button onclick="inputAction(7)">7</button><button onclick="inputAction(8)">8</button><button onclick="inputAction(9)">9</button>
            </div>
        </div>
    </div>

    <script src="./js/engine.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
